services:
  - type: web
    name: parking-lot-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:server
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
